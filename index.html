<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>啪嗒挑战</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="game-wrap" aria-label="啪嗒挑战">
        <header class="topbar">
          <div class="brand">
            <span class="logo-mark" aria-hidden="true">啪</span>
            <div>
              <h1>啪嗒挑战</h1>
              <p id="statusText">打中移动目标，稳住进度条</p>
            </div>
          </div>

          <div class="stats" aria-label="游戏数据">
            <div class="stat">
              <span>序号</span>
              <strong id="stageValue">1/19</strong>
            </div>
            <div class="stat">
              <span>连击</span>
              <strong id="comboValue">0</strong>
            </div>
            <div class="stat">
              <span>进度</span>
              <strong id="progressValue">0%</strong>
            </div>
            <div class="stat">
              <span>点击</span>
              <strong id="tapValue">0</strong>
            </div>
            <div class="stat">
              <span>完成</span>
              <strong id="doneValue">0</strong>
            </div>
          </div>
        </header>

        <div class="stage-area" id="stageArea">
          <div class="photo-frame">
            <img id="sequenceImage" alt="序列图片" draggable="false" />
            <canvas id="gameCanvas" aria-label="移动目标游戏区域"></canvas>
            <div class="photo-shine" aria-hidden="true"></div>
          </div>

          <div class="stage-overlay" id="startOverlay">
            <div class="overlay-panel">
              <h2>顺序解锁</h2>
              <p>追着画面里的目标打，命中会涨进度，打空会掉进度，越到后面越快。</p>
              <button class="primary-btn" id="startButton" type="button">开始</button>
            </div>
          </div>
        </div>

        <section class="progress-panel" aria-label="图片进度">
          <div class="progress-meta">
            <span id="imageName">00001.jpg</span>
            <span id="tapHint">下跌 4.8%/秒</span>
          </div>
          <div class="progress-track" id="progressTrack" aria-label="当前图片进度">
            <span id="progressFill"></span>
          </div>
        </section>

        <footer class="controls">
          <div class="actions">
            <button class="icon-btn" id="soundButton" type="button" aria-label="声音">♪</button>
            <button class="ghost-btn" id="prevButton" type="button">上一张</button>
            <button class="ghost-btn" id="resetButton" type="button">重来</button>
            <button class="ghost-btn" id="shareButton" type="button">分享</button>
          </div>
        </footer>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
